<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>💗 여행 컬렉션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:#111}
button,input,textarea,select{font-family:inherit}
a{text-decoration:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:2px}

#loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:2000}
.spin{width:28px;height:28px;border:3px solid #eee;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:1500;padding:20px}
#login-overlay.open{display:flex}
.login-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.login-title{font-size:20px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:13px;color:#aaa;margin-bottom:16px}
.login-field{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #e0e0e0;font-size:14px;outline:none;margin-bottom:6px;text-align:center}
.login-btn{width:100%;padding:11px;border-radius:8px;border:none;background:#111;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:0}
.login-btn:hover{opacity:.8}
.login-error{color:#e05c5c;font-size:12px;margin-top:4px;min-height:0}
.guest-btn{background:none;border:none;color:#aaa;font-size:12px;cursor:pointer;margin-top:12px;text-decoration:underline}

#header{border-bottom:1px solid #e8e8e8;position:sticky;top:0;background:#fff;z-index:100}
#header-row{padding:18px 24px 0;display:flex;align-items:center;justify-content:space-between}
#app-title{font-size:17px;font-weight:600;letter-spacing:-.3px}
#header-right{display:flex;align-items:center;gap:12px}
.add-btn{background:#111;color:#fff;border:none;border-radius:6px;padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer}
.add-btn:hover{opacity:.75}
#tabs{padding:0 24px;display:flex;margin-top:14px}
.tab-btn{padding:9px 14px;background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:500;color:#aaa;cursor:pointer;transition:color .15s}
.tab-btn.active{color:#111;border-bottom-color:#111}

#split{display:flex;height:calc(100vh - 91px);overflow:hidden}
#left{flex:1 1 0;overflow-y:auto;overflow-x:visible;padding:22px 28px}
#divider{width:9px;flex-shrink:0;cursor:col-resize;display:flex;align-items:stretch;justify-content:center;z-index:10}
#divider-line{width:1px;background:#e8e8e8;transition:background .15s}
#divider:hover #divider-line{background:#999}
#right{overflow-y:auto;padding:22px 20px;flex-shrink:0}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;padding-bottom:20px;align-content:start}
.empty-msg{text-align:center;color:#ccc;font-size:13px;padding:50px 0}

.card{border-radius:12px;border:1px solid #ebebeb;background:#fff;cursor:pointer;transition:box-shadow .2s,transform .2s;overflow:visible}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);transform:translateY(-2px)}
.card.dragging{opacity:.4;transform:scale(.97)}
.card.drag-over{box-shadow:0 0 0 2px #111}
.card-img{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f5f5f5;border-radius:12px 12px 0 0;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-icon{font-size:30px;opacity:.25}
.link-card-thumb{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.link-platform-icon{font-size:36px}
.link-platform-label{font-size:11px;font-weight:600;letter-spacing:.03em}
.card-body{padding:12px 14px 16px}
.card-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.card-tag{font-size:11px;color:#aaa;font-weight:500}
.card-name{font-size:14px;font-weight:600;color:#111;margin-bottom:5px;line-height:1.4}
.card-note{font-size:12px;color:#999;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tip{font-size:12px;color:#888;line-height:1.55;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-links-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.link-pill-map{font-size:11px;color:#e07840;background:#fff5ee;padding:2px 8px;border-radius:10px;border:1px solid #f0c090}
.link-pill{font-size:11px;color:#2060a0;background:#f0f5ff;padding:2px 8px;border-radius:10px;border:1px solid #a8c0e8;cursor:pointer}
.hearts{display:flex;gap:1px;margin-top:6px;padding-bottom:4px}
.heart-btn{display:block;width:18px;height:18px;background:none;border:none;padding:0;cursor:pointer;transition:transform .12s}
.heart-btn:hover{transform:scale(1.2)}
.author-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#aaa;margin-top:5px}
.author-avatar{width:16px;height:16px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden;flex-shrink:0}
.author-avatar img{width:100%;height:100%;object-fit:cover}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e8e8e8}
.section-title{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.form-box{background:#fafafa;border:1px solid #ebebeb;border-radius:10px;padding:13px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.field{padding:9px 12px;border-radius:7px;border:1px solid #e0e0e0;font-size:13px;outline:none;background:#fff;color:#111;width:100%}
textarea.field{resize:vertical}
.save-btn{padding:8px 16px;border-radius:6px;border:none;background:#111;color:#fff;font-size:13px;font-weight:500;cursor:pointer;align-self:flex-start}
.save-btn:hover{opacity:.75}
.cancel-btn{padding:7px 16px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;font-size:13px;color:#666;cursor:pointer}
.cat-trigger{width:100%;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e0e0e0;border-radius:7px;padding:8px 12px;cursor:pointer;text-align:left}
.dot-sm{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.pencil-btn{width:34px;height:34px;border-radius:7px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pencil-btn:hover{background:#f0f0f0}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #e8e8e8;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.1);z-index:300;max-height:260px;overflow-y:auto}
.drop-header{padding:10px 14px 6px;font-size:11px;font-weight:600;color:#aaa;letter-spacing:.04em;text-transform:uppercase}
.drop-item{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;color:#333;cursor:pointer}
.drop-item:hover{background:#f8f8f8}
.memo-list{display:flex;flex-direction:column}
.memo-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #f2f2f2;cursor:grab}
.memo-item.dragging{opacity:.4}
.memo-item.drag-over{border-top:2px solid #111}
.list-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px;white-space:nowrap;margin-top:1px;flex-shrink:0}
.memo-text{font-size:13px;color:#333;line-height:1.6}
.memo-url{font-size:11px;color:#0066cc;word-break:break-all;display:block;margin-top:4px;opacity:.8}
.del-btn{background:none;border:none;color:#ccc;font-size:11px;cursor:pointer;padding:0;flex-shrink:0}
.del-btn:hover{color:#999}
.icon-btn{background:none;border:none;color:#ccc;cursor:pointer;padding:0;flex-shrink:0;display:flex;align-items:center}
.icon-btn:hover{color:#888}
.empty-small{color:#ccc;font-size:12px;padding:14px 0}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:400;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:15px;font-weight:600}
.close-btn{background:none;border:none;font-size:16px;color:#999;cursor:pointer}
.type-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.type-btn{padding:7px 14px;border-radius:20px;border:1.5px solid #e8e8e8;font-size:12px;font-weight:500;background:#fff;color:#888;cursor:pointer;transition:all .15s}
.type-btn.active{background:#111;border-color:#111;color:#fff}
.type-btn:hover{border-color:#bbb;color:#555}
.img-upload-area{height:120px;border-radius:10px;overflow:hidden;position:relative;background:#f5f5f5;border:1px dashed #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:10px;flex-direction:column;gap:4px}
.img-upload-label{font-size:13px;color:#bbb}
.link-pair{display:flex;flex-direction:column;gap:4px;background:#f9f9f9;border-radius:8px;padding:8px;position:relative}
.link-pair-row{display:flex;gap:6px}
.add-link-btn{background:none;border:1px solid #e0e0e0;border-radius:7px;width:32px;font-size:16px;cursor:pointer;color:#aaa;flex-shrink:0}
.del-link-btn{background:none;border:1px solid #e0e0e0;border-radius:7px;width:32px;font-size:13px;cursor:pointer;color:#ccc;flex-shrink:0}

.viewer-modal{background:#fff;border-radius:14px;overflow:hidden;width:100%;max-width:440px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.2);position:relative}
.viewer-top-btns{position:absolute;top:12px;right:12px;z-index:10;display:flex;gap:8px}
.viewer-icon-btn{background:rgba(0,0,0,.35);border:none;border-radius:50%;width:30px;height:30px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.viewer-icon-btn:hover{opacity:.75}
.viewer-img-box{position:relative;background:#f0f0f0;flex-shrink:0}
.viewer-img-box img{width:100%;height:auto;max-height:360px;object-fit:contain;display:block}
.viewer-no-img{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:52px;opacity:.2}
.viewer-body{padding:16px 20px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.viewer-tag{font-size:11px;color:#aaa;font-weight:500;letter-spacing:.03em}
.viewer-name{font-size:17px;font-weight:700;color:#111;margin:5px 0 8px;line-height:1.3}
.viewer-note{font-size:13px;color:#666;line-height:1.65}
.viewer-tip{font-size:13px;color:#777;line-height:1.65;margin-top:6px;background:#f9f9f9;padding:8px 12px;border-radius:8px}
.viewer-link-item{display:flex;align-items:center;justify-content:space-between;background:#f0f5ff;padding:6px 12px;border-radius:10px;border:1px solid #a8c0e8;margin-top:6px}
.viewer-link-title{font-size:12px;color:#2060a0}
.viewer-link-icon{font-size:16px;color:#4080c0;flex-shrink:0;line-height:1}
.viewer-map-link{font-size:12px;color:#e07840;background:#fff5ee;padding:6px 12px;border-radius:10px;border:1px solid #f0c090;display:flex;align-items:center;gap:6px;margin-top:8px}
.edit-type-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.edit-type-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #e8e8e8;font-size:12px;font-weight:500;background:#fff;color:#888;cursor:pointer;transition:all .15s}
.edit-type-btn.active{background:#111;border-color:#111;color:#fff}
.edit-type-btn:hover{border-color:#bbb;color:#555}
.edit-thumb{height:44px;border-radius:8px;overflow:hidden;position:relative;background:#f9f9f9;border:1px dashed #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:8px}
.edit-thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.edit-input-field{display:block;width:100%;padding:9px 12px;border-radius:8px;border:1px solid #e0e0e0;font-size:14px;font-weight:600;color:#111;outline:none;margin-bottom:8px}
.edit-textarea-field{display:block;width:100%;padding:9px 12px;border-radius:8px;border:1px solid #e0e0e0;font-size:13px;color:#555;outline:none;resize:vertical;margin-bottom:6px}
.edit-small-input{display:block;width:100%;padding:7px 10px;border-radius:7px;border:1px solid #e0e0e0;font-size:12px;color:#111;outline:none}
.edit-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.del-zone{margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0}
.del-card-btn{background:none;border:none;color:#e05c5c;font-size:12px;cursor:pointer;padding:0}

.cat-modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.14);max-height:85vh;display:flex;flex-direction:column}
.cat-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.reset-btn{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid #e0e0e0;background:#fafafa;color:#666;cursor:pointer}
.new-cat-row{display:flex;align-items:center;gap:10px;background:#f8f8f8;border:1px solid #ebebeb;border-radius:10px;padding:12px 14px;margin-bottom:14px;position:relative}
.color-dot-btn{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.08);cursor:pointer;flex-shrink:0}
.color-picker-wrap{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:500;display:none}
.color-picker-wrap.open{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:220px}
.color-swatch{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer}
.color-swatch:hover{transform:scale(1.15)}
.cat-list{overflow-y:auto;flex:1}
.cat-list-item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #f5f5f5;position:relative}
.cat-list-name{font-size:14px;color:#333;flex:1}
.cat-del-btn{background:none;border:none;color:#e06060;font-size:13px;cursor:pointer;margin-left:auto}
.cat-note{font-size:11px;color:#bbb;margin-top:14px;line-height:1.6}

.profile-bar{display:flex;align-items:center;gap:8px}
.profile-avatar{width:30px;height:30px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;flex-shrink:0;cursor:pointer;border:1px solid #e8e8e8}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name-btn{font-size:13px;color:#555;background:none;border:none;cursor:pointer;padding:0}
.logout-small{font-size:11px;color:#bbb;background:none;border:none;cursor:pointer;padding:0}
.profile-modal-box{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.14)}
.profile-preview{width:64px;height:64px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 8px;overflow:hidden;border:1px solid #e8e8e8;cursor:pointer}
.profile-preview img{width:100%;height:100%;object-fit:cover}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.emoji-btn{font-size:22px;width:38px;height:38px;border-radius:50%;border:2px solid transparent;background:#f5f5f5;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.emoji-btn.selected{border-color:#111;background:#fff;transform:scale(1.1)}

.cropper-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.cropper-head{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:2px}
.crop-btns{display:flex;gap:8px;justify-content:flex-end;width:100%}

/* ── MOBILE ── */
#mobile-tabs{display:none}
.mobile-tab{padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;font-size:14px;font-weight:600;color:#aaa;cursor:pointer}
.mobile-tab.active{color:#111;border-bottom-color:#111}

@media(max-width:768px){
  .overlay{align-items:flex-start;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #crop-overlay .modal{max-width:100% !important}
  #crop-canvas, #crop-cont img{max-width:100% !important;height:auto !important}
  .viewer-modal{max-height:none;border-radius:12px}
  .viewer-body{max-height:none;overflow-y:visible}
  #split{flex-direction:column;height:auto;overflow:visible}
  #left{padding:16px;overflow:visible}
  #divider{display:none}
  #right{width:100% !important;padding:16px;border-top:1px solid #e8e8e8}
  #mobile-tabs{display:flex;padding:0 16px;border-bottom:1px solid #e8e8e8}
  #tabs{padding:0 16px}
  #grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  #header-row{padding:14px 16px 0}
  .modal{max-width:100% !important;margin:0;border-radius:12px}
  .overlay{padding:12px}
  .viewer-modal{max-width:100% !important}
  #add-card-wrap .add-btn{font-size:12px;padding:6px 10px}
  #profile-area .profile-name-btn{display:none}
}
.memo-filter-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.memo-filter-btn{padding:4px 12px;border-radius:20px;border:1.5px solid #e8e8e8;background:#fff;font-size:12px;font-weight:500;color:#aaa;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.memo-filter-btn.active{background:#111;border-color:#111;color:#fff}
.memo-filter-btn .filter-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><span>불러오는 중...</span></div>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-title">✈️ 여행 컬렉션</div>
    <div class="login-sub">멤버 로그인 또는 게스트로 둘러보기</div>
    <input class="login-field" id="login-name" placeholder="이름" maxlength="10"/>
    <input class="login-field" id="login-pin" placeholder="PIN (4자리)" type="password" maxlength="4"/>
    <div class="login-error" id="login-error"></div>
    <button class="login-btn" id="login-btn">로그인</button><br>
    <button class="guest-btn" id="guest-btn">게스트(Guest)로 둘러보기 →</button>
  </div>
</div>

<div id="app" style="display:none">
  <!-- HEADER -->
  <div id="header">
    <div id="header-row">
      <div id="app-title">💗 여행 컬렉션</div>
      <div id="header-right">
        <div id="add-card-wrap"><button class="add-btn" id="open-add-card">+ 장소 추가</button></div>
        <div id="profile-area"></div>
      </div>
    </div>
    <div id="mobile-tabs">
      <button class="mobile-tab active" data-panel="collection">컬렉션</button>
      <button class="mobile-tab" data-panel="memo">메모</button>
    </div>
    <div id="tabs">
      <button class="tab-btn active" data-cat="all">전체</button>
      <button class="tab-btn" data-cat="restaurant">식당</button>
      <button class="tab-btn" data-cat="cafe">카페</button>
      <button class="tab-btn" data-cat="dessert">디저트</button>
      <button class="tab-btn" data-cat="attraction">관광지</button>
      <button class="tab-btn" data-cat="disney">디즈니</button>
    </div>
  </div>

  <!-- SPLIT -->
  <div id="split">
    <div id="left"><div id="grid"></div></div>
    <div id="divider"><div id="divider-line"></div></div>
    <div id="right" style="width:380px">
      <div class="section-head"><span class="section-title">메모</span></div>
      <div id="memo-filter-wrap" class="memo-filter-wrap"></div>
      <div class="form-box" id="memo-form">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="position:relative;flex:1" id="cat-wrap">

// ─── HELPERS ─────────────────────────────────────────────────────
function esc(s) {
  var d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}
function hexBg(hex) {
  try {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return "rgba("+r+","+g+","+b+",.12)";
  } catch(e) { return "#f0f0f0"; }
}
function getCat(id) { return memoCats.find(function(c){ return c.id === id; }); }
function isLoggedIn() { return currentUser !== null; }
function isAuthor(card) {
  if (!isLoggedIn() || !card.author) return false;
  var loginId = currentUser.loginId || currentUser.name;
  if (loginId === "suri") return true; // admin
  return card.author.loginId === loginId || card.author.name === currentUser.name;
}
function el(id) { return document.getElementById(id); }
function openOverlay(id) { el(id).classList.add("open"); }
function closeOverlay(id) { el(id).classList.remove("open"); }

// ─── FIREBASE ────────────────────────────────────────────────────
async function fbLoad(col) {
  var db = window.__db;
  if (!db) return null;
  try {
    var snap = await db.collection("trips").doc(TRIP_ID).collection(col).get();
    return snap.docs.map(function(d){ return d.data(); });
  } catch(e) { return null; }
}
async function fbSaveProfile(name, profile) {
  var db = window.__db; if (!db) return;
  try {
    await db.collection("trips").doc(TRIP_ID).collection("profiles").doc(name).set(profile);
  } catch(e) { console.error(e); }
}
async function fbLoadProfile(name) {
  var db = window.__db; if (!db) return null;
  try {
    var doc = await db.collection("trips").doc(TRIP_ID).collection("profiles").doc(name).get();
    return doc.exists ? doc.data() : null;
  } catch(e) { return null; }
}

async function fbSaveAll(col, items) {
  var db = window.__db;
  if (!db) return;
  try {
    var ref = db.collection("trips").doc(TRIP_ID).collection(col);
    var batch = db.batch();
    var existing = await ref.get();
    existing.docs.forEach(function(d){ batch.delete(d.ref); });
    items.forEach(function(item, idx){
      var toSave = (col === "cards" || col === "memos") ? Object.assign({}, item, {order: idx}) : item;
      batch.set(ref.doc(String(item.id)), toSave);
    });
    await batch.commit();
  } catch(e) { console.error(e); }
}

// ── REALTIME LISTENERS ───────────────────────────────────────────
function setupRealtimeListeners() {
  var db = window.__db; if (!db) return;
  var ref = db.collection("trips").doc(TRIP_ID);

  // cards
  ref.collection("cards").onSnapshot(function(snap) {
    var data = snap.docs.map(function(d){ return d.data(); });
    if (!data.length) return;
    cards = data.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
    renderGrid();
  }, function(e){ console.error("cards listener:", e); });

  // memos
  ref.collection("memos").onSnapshot(function(snap) {
    var data = snap.docs.map(function(d){ return d.data(); });
    if (!data.length) return;
    memos = data.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
    renderMemoFilter(); renderMemos();
  }, function(e){ console.error("memos listener:", e); });

  // profiles — sync current user's emoji if changed on another device
  ref.collection("profiles").onSnapshot(function(snap) {
    snap.docs.forEach(function(d) {
      var profile = d.data();
      // update localStorage cache
      localStorage.setItem("profile_"+profile.name, JSON.stringify(profile));
      // if this is the current user, update their session
      var profileKey = profile.loginId || profile.name;
      // update localStorage for all profiles (for avatarHTML lookup)
      localStorage.setItem("profile_"+profileKey, JSON.stringify(profile));
      if (currentUser && (currentUser.loginId === profileKey || currentUser.name === profile.name)) {
        if (currentUser.emoji !== profile.emoji || currentUser.name !== profile.name) {
          currentUser.emoji = profile.emoji;
          currentUser.name = profile.name;
          saveSession();
          renderProfileArea();
        }
      }
      // re-render to pick up updated emojis/names from localStorage
      renderGrid(); renderMemos();
    });
  }, function(e){ console.error("profiles listener:", e); });
}

// ─── HEARTS ──────────────────────────────────────────────────────
function heartSVG(filled, size) {
  var fill = filled ? "url(#hg)" : "#f5e6ec";
  var stroke = filled ? "#ff9dbf" : "#e8c4d4";
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
    + '<defs><radialGradient id="hg" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#ffb3cc"/><stop offset="100%" stop-color="#ff7aa8"/></radialGradient></defs>'
    + '<path d="M50 85 C50 85 15 60 15 38 C15 24 25 14 38 17 C43 18 47 22 50 26 C53 22 57 18 62 17 C75 14 85 24 85 38 C85 60 50 85 50 85Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>'
    + '</svg>';
}
function renderHearts(containerId, value, size, interactive) {
  var container = el(containerId);
  if (!container) return;
  container.innerHTML = "";
  for (var i = 1; i <= 5; i++) {
    (function(idx){
      var btn = document.createElement("button");
      btn.className = "heart-btn";
      btn.style.width = size + "px";
      btn.style.height = size + "px";
      btn.innerHTML = heartSVG(idx <= value, size);
      btn.setAttribute("data-i", idx);
      if (!interactive) btn.style.cursor = "default";
      container.appendChild(btn);
    })(i);
  }
}
function makeHeartsInteractive(containerId, getValue, setValue, size) {
  var container = el(containerId);
  if (!container) return;
  container.querySelectorAll(".heart-btn").forEach(function(btn) {
    var idx = parseInt(btn.dataset.i);
    btn.addEventListener("mouseenter", function(){
      container.querySelectorAll(".heart-btn").forEach(function(b, bi){
        b.innerHTML = heartSVG(bi+1 <= idx, size);
      });
    });
    btn.addEventListener("mouseleave", function(){
      var v = getValue();
      container.querySelectorAll(".heart-btn").forEach(function(b, bi){
        b.innerHTML = heartSVG(bi+1 <= v, size);
      });
    });
    btn.addEventListener("click", function(){
      var v = getValue();
      setValue(idx === v ? 0 : idx);
      var newV = getValue();
      container.querySelectorAll(".heart-btn").forEach(function(b, bi){
        b.innerHTML = heartSVG(bi+1 <= newV, size);
      });
    });
  });
}
function heartsHTML(value, size) {
  var h = "";
  for (var i = 1; i <= 5; i++) {
    h += heartSVG(i <= value, size);
  }
  return h;
}

// ─── AVATAR ──────────────────────────────────────────────────────
function getCurrentProfile(user) {
  if (!user) return null;
  // try loginId first (stable), then name
  var keys = [];
  if (user.loginId) keys.push(user.loginId);
  if (user.name && user.name !== user.loginId) keys.push(user.name);
  for (var i = 0; i < keys.length; i++) {
    var stored = localStorage.getItem("profile_"+keys[i]);
    if (stored) { try { return JSON.parse(stored); } catch(e){} }
  }
  return null;
}

function avatarHTML(size, user) {
  if (!user) return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:'+(size*.55)+'px">👤</div>';
  var displayEmoji = user.emoji || "👤";
  var p = getCurrentProfile(user);
  if (p && p.emoji) displayEmoji = p.emoji;
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:'+(size*.55)+'px;overflow:hidden;border:1px solid #eee;flex-shrink:0">'+displayEmoji+'</div>';
}

function getAuthorName(user) {
  if (!user) return "";
  var p = getCurrentProfile(user);
  if (p && p.name) return p.name;
  return user.name || "";
}

// ─── RENDER GRID ─────────────────────────────────────────────────
function renderGrid() {
  var grid = el("grid");
  var filtered = activeCat === "all" ? cards : cards.filter(function(c){ return c.type === activeCat; });
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-msg">저장된 장소가 없어요</div>';
    return;
  }
  grid.innerHTML = "";
  filtered.forEach(function(card) {
    var div = document.createElement("div");
    div.className = "card";
    div.dataset.id = card.id;

    // img
    var imgDiv = document.createElement("div");
    imgDiv.className = "card-img";
    if (card.image) {
      var img = document.createElement("img");
      img.src = card.image;
      imgDiv.appendChild(img);
    } else if (card.type === "link") {
      var pInfo = getPlatformInfo(card.linkUrl || "");
      imgDiv.style.background = pInfo.bg;
      var lThumb = document.createElement("div");
      lThumb.className = "link-card-thumb";
      var lIcon = document.createElement("div");
      lIcon.className = "link-platform-icon";
      lIcon.style.cssText = "font-size:36px;color:"+pInfo.color+";font-weight:700;font-family:sans-serif";
      lIcon.textContent = pInfo.icon;
      var lLabel = document.createElement("div");
      lLabel.className = "link-platform-label";
      lLabel.style.color = pInfo.color;
      lLabel.textContent = pInfo.label;
      lThumb.appendChild(lIcon);
      lThumb.appendChild(lLabel);
      imgDiv.appendChild(lThumb);
    } else {
      var icon = document.createElement("span");
      icon.className = "card-icon";
      icon.textContent = TYPE_ICON[card.type] || "📍";
      imgDiv.appendChild(icon);
    }
    div.appendChild(imgDiv);

    // body
    var body = document.createElement("div");
    body.className = "card-body";

    var meta = document.createElement("div");
    meta.className = "card-meta";
    var tag = document.createElement("span");
    tag.className = "card-tag";
    tag.textContent = TYPE_LABEL[card.type] || card.type;
    meta.appendChild(tag);
    if (card.author) {
      var authorDiv = document.createElement("div");
      authorDiv.style.cssText = "display:inline-flex;align-items:center;gap:3px;margin-left:auto";
      if (isLoggedIn()) {
        authorDiv.innerHTML = avatarHTML(14, card.author) + '<span style="font-size:10px;color:#aaa">' + esc(getAuthorName(card.author)) + '</span>';
      } else {
        authorDiv.innerHTML = avatarHTML(16, card.author);
      }
      meta.appendChild(authorDiv);
    }
    body.appendChild(meta);

    var name = document.createElement("div");
    name.className = "card-name";
    name.textContent = card.name;
    body.appendChild(name);
    if (card.nameCn) {
      var nameCn = document.createElement("div");
      nameCn.className = "card-name";
      nameCn.style.marginTop = "-3px";
      nameCn.textContent = card.nameCn;
      body.appendChild(nameCn);
    }

    if (card.note) {
      var note = document.createElement("div");
      note.className = "card-note";
      note.innerHTML = esc(card.note).replace(/\n/g, "<br>");
      body.appendChild(note);
    }

    // link pills
    if (card.tip) {
      var tip = document.createElement("div");
      tip.className = "card-tip";
      tip.innerHTML = "💡 " + esc(card.tip).replace(/\n/g, "<br>");
      body.appendChild(tip);
    }

    // links row
    var hasLinks = card.mapLink || (card.links && card.links.length);
    if (hasLinks) {
      var pillRow = document.createElement("div");
      pillRow.className = "card-links-row";
      if (card.mapLink) {
        var mapPill = document.createElement("a");
        mapPill.href = card.mapLink; mapPill.target = "_blank";
        mapPill.className = "link-pill-map"; mapPill.textContent = "📍 지도";
        mapPill.addEventListener("click", function(e){ e.stopPropagation(); });
        pillRow.appendChild(mapPill);
      }
      if (card.links && card.links.length) {
        var lPill = document.createElement("span");
        lPill.className = "link-pill"; lPill.textContent = "🔗 링크";
        lPill.addEventListener("click", function(e){ e.stopPropagation(); openViewer(card.id); });
        pillRow.appendChild(lPill);
      }
      body.appendChild(pillRow);
    }

    if (card.type === "link" && card.linkUrl) {
      var goBtn = document.createElement("a");
      goBtn.href = card.linkUrl; goBtn.target = "_blank";
      goBtn.className = "link-pill"; goBtn.textContent = "🔗 열기";
      goBtn.addEventListener("click", function(e){ e.stopPropagation(); });
      var lr2 = document.createElement("div");
      lr2.className = "card-links-row"; lr2.appendChild(goBtn);
      body.appendChild(lr2);
    }

    // hearts
    if (card.rating > 0) {
      var heartsDiv = document.createElement("div");
      heartsDiv.className = "hearts";
      heartsDiv.style.paddingBottom = "4px";
      heartsDiv.innerHTML = heartsHTML(card.rating, 18);
      body.appendChild(heartsDiv);
    }



    div.appendChild(body);

    // click
    div.addEventListener("click", function(){ openViewer(card.id); });

    // drag
    div.setAttribute("draggable", "true");
    div.addEventListener("dragstart", function(e){
      if (!isLoggedIn()) { e.preventDefault(); return; }
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(card.id));
      setTimeout(function(){ div.classList.add("dragging"); }, 0);
    });
    div.addEventListener("dragend", function(){
      div.classList.remove("dragging");
      grid.querySelectorAll(".card").forEach(function(c){ c.classList.remove("drag-over"); });
    });
    div.addEventListener("dragover", function(e){
      e.preventDefault();
      grid.querySelectorAll(".card").forEach(function(c){ c.classList.remove("drag-over"); });
      div.classList.add("drag-over");
    });
    div.addEventListener("dragleave", function(){ div.classList.remove("drag-over"); });
    div.addEventListener("drop", function(e){
      e.preventDefault();
      div.classList.remove("drag-over");
      var fromId = parseInt(e.dataTransfer.getData("text/plain"));
      var toId = card.id;
      if (fromId === toId) return;
      var fi = cards.findIndex(function(c){ return c.id === fromId; });
      var ti = cards.findIndex(function(c){ return c.id === toId; });
      if (fi === -1 || ti === -1) return;
      var moved = cards.splice(fi, 1)[0];
      cards.splice(ti, 0, moved);
      fbSaveAll("cards", cards);
      renderGrid();
    });

    grid.appendChild(div);
  });
}

// ─── MEMO FILTER ─────────────────────────────────────────────────
function renderMemoFilter() {
  var wrap = el("memo-filter-wrap");
  if (!wrap) return;
  wrap.innerHTML = "";

  // 전체 버튼
  var allBtn = document.createElement("button");
  allBtn.className = "memo-filter-btn" + (activeMemoFilter === null ? " active" : "");
  allBtn.textContent = "전체";
  allBtn.addEventListener("click", function(){
    activeMemoFilter = null;
    renderMemoFilter();
    renderMemos();
  });
  wrap.appendChild(allBtn);

  // 카테고리 버튼들
  memoCats.forEach(function(c) {
    // only show if there are memos with this cat
    var hasMemos = memos.some(function(m){ return m.catId === c.id; });
    if (!hasMemos) return;
    var btn = document.createElement("button");
    btn.className = "memo-filter-btn" + (activeMemoFilter === c.id ? " active" : "");
    var dot = document.createElement("span");
    dot.className = "filter-dot";
    dot.style.background = activeMemoFilter === c.id ? "#fff" : c.color;
    btn.appendChild(dot);
    var label = document.createElement("span");
    label.textContent = c.name;
    btn.appendChild(label);
    btn.addEventListener("click", function(){
      activeMemoFilter = c.id;
      renderMemoFilter();
      renderMemos();
    });
    wrap.appendChild(btn);
  });

  // URL 필터 (URL 있는 메모만)
  var hasUrl = memos.some(function(m){ return m.url; });
  if (hasUrl) {
    var urlBtn = document.createElement("button");
    urlBtn.className = "memo-filter-btn" + (activeMemoFilter === "url" ? " active" : "");
    urlBtn.textContent = "🔗 링크";
    urlBtn.addEventListener("click", function(){
      activeMemoFilter = "url";
      renderMemoFilter();
      renderMemos();
    });
    wrap.appendChild(urlBtn);
  }
}

      setTimeout(function(){ item.classList.add("dragging"); }, 0);
    });
    item.addEventListener("dragend", function(){
      item.classList.remove("dragging");
      list.querySelectorAll(".memo-item").forEach(function(x){ x.classList.remove("drag-over"); });
    });
    item.addEventListener("dragover", function(e){
      e.preventDefault();
      list.querySelectorAll(".memo-item").forEach(function(x){ x.classList.remove("drag-over"); });
      item.classList.add("drag-over");
    });
    item.addEventListener("dragleave", function(){ item.classList.remove("drag-over"); });
    item.addEventListener("drop", function(e){
      e.preventDefault();
      item.classList.remove("drag-over");
      var fromId = parseInt(e.dataTransfer.getData("text/plain"));
      var toId = m.id;
      if (fromId === toId) return;
      var fi = memos.findIndex(function(x){ return x.id === fromId; });
      var ti = memos.findIndex(function(x){ return x.id === toId; });
      if (fi === -1 || ti === -1) return;
      var moved = memos.splice(fi, 1)[0];
      memos.splice(ti, 0, moved);
      fbSaveAll("memos", memos);
      renderMemoFilter(); renderMemos();
    });

    list.appendChild(item);
  });
}

function renderViewerRead(card) {
  el("viewer-edit-btn").style.display = "flex";

  // collect all images
  var allImages = [];
  if (card.images && card.images.length) allImages = card.images.slice();
  else if (card.image) allImages = [card.image];

  if (allImages.length === 0) {
    imgBox.innerHTML = '<div class="viewer-no-img">'+TYPE_ICON[card.type]+'</div>';
  } else if (allImages.length === 1) {
    imgBox.innerHTML = '<img src="'+allImages[0]+'" alt="">';
  } else {
    // multiple images - show with nav
    var idx = 0;
    function renderViewerImg() {
      imgBox.innerHTML = '<img src="'+allImages[idx]+'" alt="">'
        + '<button id="prev-img" style="position:absolute;top:50%;left:10px;transform:translateY(-50%);background:rgba(0,0,0,.4);border:none;color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;z-index:5">‹</button>'
        + '<button id="next-img" style="position:absolute;top:50%;right:10px;transform:translateY(-50%);background:rgba(0,0,0,.4);border:none;color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;z-index:5">›</button>'
        + '<div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.4);color:#fff;padding:2px 10px;border-radius:10px;font-size:11px;z-index:5">'+(idx+1)+' / '+allImages.length+'</div>';
      el("prev-img").addEventListener("click", function(e){ e.stopPropagation(); idx = (idx - 1 + allImages.length) % allImages.length; renderViewerImg(); });
      el("next-img").addEventListener("click", function(e){ e.stopPropagation(); idx = (idx + 1) % allImages.length; renderViewerImg(); });
    }
    renderViewerImg();
  }

  var content = el("viewer-content");
  content.innerHTML = "";

  var nameEl = document.createElement("div");
  nameEl.className = "viewer-name";
  nameEl.textContent = card.name;
  content.appendChild(nameEl);
  if (card.nameCn) {
    var nameCnEl = document.createElement("div");

    noteEl.innerHTML = esc(card.note).replace(/\n/g, "<br>");
    content.appendChild(noteEl);

  if (card.tip) {
    var tipEl = document.createElement("div");

    tipEl.innerHTML = "💡 " + esc(card.tip).replace(/\n/g, "<br>");
    content.appendChild(tipEl);

  // links
  if (card.type === "link" && card.linkUrl) {
    var goA = document.createElement("a");
    goA.href = card.linkUrl;
    goA.target = "_blank";
    goA.className = "viewer-map-link";
    goA.style.cssText = "font-size:12px;color:#2060a0;background:#f0f5ff;padding:6px 12px;border-radius:10px;border:1px solid #a8c0e8;display:flex;align-items:center;gap:6px;margin-top:8px;word-break:break-all";
    goA.textContent = "🔗 " + card.linkUrl;
    content.appendChild(goA);
  } else if (card.mapLink) {
    var mapA = document.createElement("a");
    mapA.href = card.mapLink;
    mapA.target = "_blank";
    mapA.className = "viewer-map-link";
    mapA.innerHTML = "📍 <span>지도 링크</span>";
    content.appendChild(mapA);
  }
  if (card.links && card.links.length) {
    card.links.forEach(function(lnk) {
      var url = typeof lnk === "object" ? (lnk.url || "") : (lnk || "");
      var title = typeof lnk === "object" ? (lnk.title || url) : url;
      if (!url) return;
      var lDiv = document.createElement("div");
      lDiv.className = "viewer-link-item";
      var lTitle = document.createElement("span");
      lTitle.className = "viewer-link-title";

      lA.href = url;
      lA.target = "_blank";

      lDiv.appendChild(lA);

    function(){ return card.rating || 0; },
    function(v){ card.rating = v; fbSaveAll("cards", cards); renderGrid(); },
    22

// edit mode
var editImgFile = null;
var editImageData = null;
var editType = null;

function openViewerEdit() {
  var card = cards.find(function(c){ return c.id === viewingCardId; });
  if (!card) return;
  el("viewer-edit-btn").style.display = "none";
  el("viewer-tag").textContent = ""; // hide in edit mode
  editType = card.type;
  editImageData = card.image || null;
  // get current images (may be 1 or 2)
  var editImages = [];
  if (card.images && card.images.length) editImages = card.images.slice();
  else if (card.image) editImages = [card.image];

  // imgbox clickable
  var imgBox = el("viewer-img-box");
  imgBox.style.cursor = "pointer";
  renderEditImgBoxMulti(imgBox, editImages);

  // create file input
  if (!editImgFile) {
    editImgFile = document.createElement("input");
    editImgFile.type = "file";
    editImgFile.accept = "image/*";
    editImgFile.style.display = "none";
    document.body.appendChild(editImgFile);
  }
  editImgFile.onchange = null;
  editImgFile.value = "";
  editImgFile.addEventListener("change", function handler(e) {
    editImgFile.removeEventListener("change", handler);
    var file = e.target.files[0];
    if (!file) return;
    editImgFile.value = "";
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      var img = new Image();
      img.onload = function() {
        if (Math.abs(img.width/img.height - 1) > 0.02) {
          openCropper(dataUrl, function(cropped) {
            editImageData = cropped;
            renderEditImgBox(el("viewer-img-box"), editImageData);
          });
        } else {
          editImageData = dataUrl;
          renderEditImgBox(el("viewer-img-box"), editImageData);
        }
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  });

  imgBox.onclick = function(e) {
    if (e.target.dataset.action === "del-img") {
      editImageData = null;
      renderEditImgBox(imgBox, null);
      return;
    }
    editImgFile.click();
  };

  // content
  var content = el("viewer-content");
  content.innerHTML = "";

  // type row
  var typeRow = document.createElement("div");
  typeRow.className = "edit-type-row";
  ["restaurant","cafe","dessert","attraction","disney"].forEach(function(t) {
    var btn = document.createElement("button");
    btn.className = "edit-type-btn" + (editType === t ? " active" : "");
    btn.textContent = TYPE_LABEL[t];
    btn.addEventListener("click", function() {
      editType = t;
      typeRow.querySelectorAll(".edit-type-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
    });
    typeRow.appendChild(btn);
  });
  content.appendChild(typeRow);

  var nameInput = document.createElement("input");
  nameInput.className = "edit-input-field";
  nameInput.value = card.name;
  nameInput.placeholder = "장소 이름";
  content.appendChild(nameInput);
  var nameCnInput = document.createElement("input");
  nameCnInput.className = "edit-input-field";
  nameCnInput.style.fontWeight = "400";
  nameCnInput.style.fontSize = "13px";
  nameCnInput.value = card.nameCn || "";
  nameCnInput.placeholder = "중국어 이름 (선택)";
  content.appendChild(nameCnInput);

  var noteTA = document.createElement("textarea");
  noteTA.className = "edit-textarea-field";
  noteTA.rows = 3;
  noteTA.placeholder = "메모";
  noteTA.textContent = card.note || "";
  content.appendChild(noteTA);

  var tipTA = document.createElement("textarea");
  tipTA.className = "edit-textarea-field";
  tipTA.rows = 4;
  tipTA.placeholder = "💡 팁";
  tipTA.textContent = card.tip || "";
  content.appendChild(tipTA);

  var mapInput = document.createElement("input");
  mapInput.className = "edit-input-field";
  mapInput.style.fontWeight = "400";
  mapInput.style.fontSize = "13px";
  mapInput.value = card.mapLink || "";
  mapInput.placeholder = "📍 맵 링크";
  content.appendChild(mapInput);

  // links
  var linksWrap = document.createElement("div");
  linksWrap.style.cssText = "display:flex;flex-direction:column;gap:8px;margin-bottom:6px";
  var existingLinks = (card.links && card.links.length) ? card.links : [{title:"",url:""}];
  existingLinks.forEach(function(lnk, i) {
    var t = typeof lnk === "object" ? (lnk.title || "") : "";
    var u = typeof lnk === "object" ? (lnk.url || "") : (lnk || "");
    linksWrap.appendChild(makeLinkPair(t, u, i > 0, linksWrap));
  });
  content.appendChild(linksWrap);

  // add link button
  var addLinkBtn = document.createElement("button");
  addLinkBtn.style.cssText = "background:none;border:none;font-size:12px;color:#aaa;cursor:pointer;padding:0;margin-bottom:8px;text-align:left";
  addLinkBtn.textContent = "+ 링크 추가";
  addLinkBtn.addEventListener("click", function(){
    if (linksWrap.querySelectorAll(".link-pair").length >= 5) return;
    linksWrap.appendChild(makeLinkPair("", "", true, linksWrap));
  });
  content.appendChild(addLinkBtn);

  // actions
  var actions = document.createElement("div");
  actions.className = "edit-actions";
  var cancelBtn = document.createElement("button");
  cancelBtn.className = "cancel-btn";
  cancelBtn.textContent = "취소";
  cancelBtn.addEventListener("click", function(){
    imgBox.onclick = null;
    imgBox.style.cursor = "";
    renderViewerRead(card);
  });
  var saveBtn = document.createElement("button");
  saveBtn.className = "save-btn";
  saveBtn.textContent = "저장";
  saveBtn.addEventListener("click", function(){
    var name = nameInput.value.trim();
    if (!name) return;
    card.type = editType;
    card.name = name;
    card.nameCn = nameCnInput.value.trim();
    card.note = noteTA.value.trim();
    card.tip = tipTA.value.trim();
    card.image = editImages[0] || null;
    card.images = editImages.slice();
    card.mapLink = mapInput.value.trim();
    card.links = [];
    linksWrap.querySelectorAll(".link-pair").forEach(function(pair) {
      var ti = pair.querySelector(".link-title-input");
      var ui = pair.querySelector(".link-url-input");
      var u = ui ? ui.value.trim() : "";
      if (u) card.links.push({title: ti ? ti.value.trim() : "", url: u});
    });
    card.link = "";
    // preserve linkUrl for link type cards
    fbSaveAll("cards", cards);
    renderGrid();
    imgBox.onclick = null;
    imgBox.style.cursor = "";
    renderViewerRead(card);
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);
  content.appendChild(actions);

  var card4del2 = cards.find(function(c){ return c.id === viewingCardId; });
  if (isAuthor(card4del2)) {
    var delZone2 = document.createElement("div");
    delZone2.className = "del-zone";
    var delBtn2 = document.createElement("button");
    delBtn2.className = "del-card-btn";
    delBtn2.textContent = "🗑 장소 삭제";
    delBtn2.addEventListener("click", function(){
      if (confirm("이 장소를 삭제할까요?\n삭제하면 되돌릴 수 없어요.")) {
        cards = cards.filter(function(c){ return c.id !== viewingCardId; });
        fbSaveAll("cards", cards);
        renderGrid();
        imgBox.onclick = null;
        closeOverlay("viewer-overlay");
        viewingCardId = null;
      }
    });
    delZone2.appendChild(delBtn2);
    content.appendChild(delZone2);
  }
}

function renderEditImgBoxMulti(imgBox, images) {

    imgBox.innerHTML = '<div style="width:100%;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#bbb;pointer-events:none"><span style="font-size:32px">📷</span><span style="font-size:13px">클릭해서 사진 추가</span></div>';
    return;
  }
  var html = '<div style="display:flex;gap:4px;padding:6px;background:#f0f0f0">';
  images.forEach(function(src, i) {
    html += '<div style="position:relative;flex:1;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#fff">';
    html += '<img src="'+src+'" style="width:100%;height:100%;object-fit:cover">';
    html += '<button data-action="del-img" data-idx="'+i+'" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:10px;cursor:pointer;z-index:5">✕</button>';

    html += '</div>';
  });
  if (images.length < 2) {
    html += '<div data-action="add-img" style="flex:1;aspect-ratio:1;border-radius:6px;background:#fff;border:1px dashed #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:#bbb"><span style="font-size:22px">+</span><span style="font-size:10px">추가</span></div>';
  }
  html += '</div>';
  imgBox.innerHTML = html;
}

function makeLinkPair(title, url, removable, wrap) {
  var pair = document.createElement("div");
  pair.className = "link-pair";
  var titleInput = document.createElement("input");
  titleInput.className = "edit-small-input link-title-input";
  titleInput.placeholder = "링크 제목";
  titleInput.value = title;
  pair.appendChild(titleInput);
  var row = document.createElement("div");
  row.className = "link-pair-row";
  var urlInput = document.createElement("input");
  urlInput.className = "edit-small-input link-url-input";

var currentImgSlot = 0;

function renderImgSlot(slot) {
  var slotEl = el("img-upload-" + (slot + 1));
  var src = newCardImages[slot];
  if (src) {
    slotEl.innerHTML = '<img src="'+src+'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover"><button data-clear="'+slot+'" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.4);border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>';
    var clearBtn = slotEl.querySelector("[data-clear]");
    if (clearBtn) clearBtn.addEventListener("click", function(ev){
      ev.stopPropagation();
      newCardImages.splice(slot, 1);
      renderImgSlot(0); renderImgSlot(1);
    });
  } else {
    var label = slot === 0 ? "대표 사진" : "추가 사진";
    slotEl.innerHTML = '<span style="font-size:22px;color:#ccc">📷</span><span class="img-upload-label">'+label+'</span>';
  }
}

function setupImgSlot(slot) {
  el("img-upload-" + (slot + 1)).addEventListener("click", function(){
    if (newCardImages[slot]) return; // already has image, do nothing
    currentImgSlot = slot;
    el("img-file-input").click();
  });
}
setupImgSlot(0);
setupImgSlot(1);

el("img-file-input").addEventListener("change", function(e){
  var file = e.target.files[0]; if (!file) return;
  e.target.value = "";
  var targetSlot = currentImgSlot;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    var img = new Image();
    img.onload = function(){
      if (Math.abs(img.width/img.height-1) > 0.02) {
        openCropper(dataUrl, function(cropped){
          newCardImages[targetSlot] = cropped;
          newCardImage = newCardImages[0] || null;
          renderImgSlot(0); renderImgSlot(1);
        });
      } else {
        newCardImages[targetSlot] = dataUrl;
        newCardImage = newCardImages[0] || null;
        renderImgSlot(0); renderImgSlot(1);
      }
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
});

// ─── CROPPER ─────────────────────────────────────────────────────
function openCropper(src, cb) {
  cropCallback = cb;
  var wrap = el("cropper-wrap");
  var DISP = 380;
  var img = new Image();
  img.onload = function(){
    var W=img.naturalWidth, H=img.naturalHeight;
    var cropX=(W-Math.min(W,H))/2, cropY=(H-Math.min(W,H))/2, cropS=Math.min(W,H);
    var scale=DISP/Math.max(W,H);
    var canW=W*scale, canH=H*scale;
    wrap.innerHTML = '<div class="cropper-head"><span style="font-weight:600;font-size:14px">사진 크롭</span><span style="font-size:12px;color:#888">드래그해서 조정</span></div>'
      +'<div style="position:relative;display:inline-block;user-select:none;touch-action:none;max-width:100%" id="crop-cont">'
      +'<img src="'+src+'" style="display:block;width:'+canW+'px;height:'+canH+'px;max-width:100%;pointer-events:none">'
      +'<canvas id="crop-canvas" style="position:absolute;top:0;left:0;width:'+canW+'px;height:'+canH+'px;max-width:100%;touch-action:none"></canvas>'
      +'</div>'
      +'<div class="crop-btns"><button class="cancel-btn" id="crop-cancel">취소</button><button class="save-btn" id="crop-done">크롭 완료</button></div>';
    var canvas=el("crop-canvas"); canvas.width=canW; canvas.height=canH;
    function draw(){
      var ctx=canvas.getContext("2d");
      ctx.clearRect(0,0,canW,canH);
      ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(0,0,canW,canH);
      var cx=cropX*scale,cy=cropY*scale,cs=cropS*scale;
      ctx.clearRect(cx,cy,cs,cs);
      ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.strokeRect(cx,cy,cs,cs);
      [[cx,cy],[cx+cs-10,cy],[cx,cy+cs-10],[cx+cs-10,cy+cs-10]].forEach(function(p){ ctx.fillStyle="#fff"; ctx.fillRect(p[0],p[1],10,10); });
    }
    draw();
    var drag=null;
    function getPos(e) {
      var r = canvas.getBoundingClientRect();
      var src = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
      return {x:(src.clientX-r.left)/scale, y:(src.clientY-r.top)/scale};
    }
    function onStart(e){
      e.preventDefault();
      var p = getPos(e), h = 20/scale;
      var cx=cropX, cy=cropY, cs=cropS;
      var mx=p.x, my=p.y;
      if(Math.abs(mx-cx)<h&&Math.abs(my-cy)<h) drag={type:"tl",ox:mx,oy:my,cx:cx,cy:cy,cs:cs};
      else if(Math.abs(mx-(cx+cs))<h&&Math.abs(my-cy)<h) drag={type:"tr",ox:mx,oy:my,cx:cx,cy:cy,cs:cs};
      else if(Math.abs(mx-cx)<h&&Math.abs(my-(cy+cs))<h) drag={type:"bl",ox:mx,oy:my,cx:cx,cy:cy,cs:cs};
      else if(Math.abs(mx-(cx+cs))<h&&Math.abs(my-(cy+cs))<h) drag={type:"br",ox:mx,oy:my,cx:cx,cy:cy,cs:cs};
      else if(mx>cx&&mx<cx+cs&&my>cy&&my<cy+cs) drag={type:"move",ox:mx,oy:my,cx:cx,cy:cy,cs:cs};
    }
    canvas.addEventListener("mousedown", onStart);
    canvas.addEventListener("touchstart", onStart, {passive:false});

    function onMove(e){
      if(!drag) return;
      e.preventDefault();
      var p = getPos(e);
      var dx=p.x-drag.ox, dy=p.y-drag.oy, nx=drag.cx, ny=drag.cy, ns=drag.cs;
      if(drag.type==="move"){nx=Math.max(0,Math.min(W-drag.cs,drag.cx+dx));ny=Math.max(0,Math.min(H-drag.cs,drag.cy+dy));}
      else if(drag.type==="br"){ns=Math.max(40,Math.min(W-drag.cx,H-drag.cy,drag.cs+dx,drag.cs+dy));}
      else if(drag.type==="tl"){var d2=Math.max(dx,dy);ns=Math.max(40,drag.cs-d2);var dd=drag.cs-ns;nx=Math.max(0,drag.cx+dd);ny=Math.max(0,drag.cy+dd);}
      else if(drag.type==="tr"){ns=Math.max(40,Math.min(W-drag.cx,drag.cs+dx));ny=Math.max(0,drag.cy+(drag.cs-ns));}
      else if(drag.type==="bl"){ns=Math.max(40,Math.min(H-drag.cy,drag.cs+dy));nx=Math.max(0,drag.cx+(drag.cs-ns));}
      cropX=nx;cropY=ny;cropS=ns;draw();
    }
    function onUp(){drag=null;}
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("touchend",onUp);
    function cleanupListeners() {
      document.removeEventListener("mousemove",onMove);
      document.removeEventListener("mouseup",onUp);
      document.removeEventListener("touchmove",onMove);
      document.removeEventListener("touchend",onUp);
    }
    el("crop-cancel").addEventListener("click",function(){ cleanupListeners(); closeOverlay("crop-overlay"); cropCallback=null; });
    el("crop-done").addEventListener("click",function(){
      cleanupListeners();
      var out=document.createElement("canvas"); out.width=400; out.height=400;
      out.getContext("2d").drawImage(img,cropX,cropY,cropS,cropS,0,0,400,400);
      closeOverlay("crop-overlay");
      if(cropCallback) cropCallback(out.toDataURL("image/jpeg",.92));
      cropCallback=null;
    });
  };
  img.src=src;
  openOverlay("crop-overlay");
}

el("login-btn").addEventListener("click", async function(){
  var name = el("login-name").value.trim();
  var pin = el("login-pin").value.trim();
  var errEl = el("login-error");
  if (!name || !pin) { errEl.textContent = "이름과 PIN을 입력해주세요"; return; }
  var member = MEMBERS.find(function(m){ return m.name===name && m.pin===pin; });
  if (!member) { errEl.textContent = "이름 또는 PIN이 올바르지 않아요"; return; }
  el("login-btn").textContent = "로딩 중..."; el("login-btn").disabled = true;
  // load from Firebase first, then localStorage
  var fbProfile = await fbLoadProfile(name);
  if (fbProfile) {
    currentUser = fbProfile;
    currentUser.loginId = name;
    localStorage.setItem("profile_"+name, JSON.stringify(currentUser));
  } else {
    var saved = localStorage.getItem("profile_"+name);
    if (saved) { try { currentUser = JSON.parse(saved); } catch(e){ currentUser = null; } }
    if (!currentUser) {
      currentUser = {name:name, emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)], photo:null};
    }
    currentUser.loginId = name;
    fbSaveProfile(name, currentUser);
    localStorage.setItem("profile_"+name, JSON.stringify(currentUser));
  }
  saveSession();
  el("login-btn").textContent = "로그인"; el("login-btn").disabled = false;
  closeOverlay("login-overlay");
  renderProfileArea(); updateUIForAuth();
});

  currentUser.photo = null;

  saveSession();
  renderProfileArea();

  // sync author emoji on all cards and memos
  syncAuthorEmoji(currentUser.loginId || currentUser.name, profSelectedEmoji, currentUser.name);
});

// ─── INIT ─────────────────────────────────────────────────────────
function syncAuthorEmoji(loginId, emoji, newName) {
  var changed = false;
  cards.forEach(function(c){
    if (c.author && (c.author.loginId === loginId || c.author.name === loginId || c.author.name === newName)) {
      c.author.emoji = emoji;
      c.author.loginId = loginId;
      if (newName) c.author.name = newName;
      c.author.photo = null;
      changed = true;
    }
  });
  if (changed) fbSaveAll("cards", cards);
  var mchanged = false;
  memos.forEach(function(m){
    if (m.author && (m.author.loginId === loginId || m.author.name === loginId || m.author.name === newName)) {
      m.author.emoji = emoji;
      m.author.loginId = loginId;
      if (newName) m.author.name = newName;
      m.author.photo = null;
      mchanged = true;
    }
  });
  if (mchanged) fbSaveAll("memos", memos);
  renderGrid();
  renderMemos();
}

// ── MOBILE TAB SWITCHING ─────────────────────────────────────────
function isMobile() { return window.innerWidth <= 768; }

function switchMobilePanel(panel) {
  if (!isMobile()) return;
  document.querySelectorAll(".mobile-tab").forEach(function(b){
    b.classList.toggle("active", b.dataset.panel === panel);
    b.style.color = b.dataset.panel === panel ? "#111" : "#aaa";
    b.style.borderBottomColor = b.dataset.panel === panel ? "#111" : "transparent";
  });
  var left = el("left");
  var right = el("right");
  var tabs = el("tabs");
  if (panel === "collection") {
    left.style.display = "block";
    tabs.style.display = "flex";
    right.style.display = "none";
  } else {
    left.style.display = "none";
    tabs.style.display = "none";
    right.style.display = "block";
  }
}

document.querySelectorAll(".mobile-tab").forEach(function(btn){
  btn.addEventListener("click", function(){ switchMobilePanel(btn.dataset.panel); });
});

window.addEventListener("resize", function(){
  if (!isMobile()) {
    el("left").style.display = "";
    el("right").style.display = "";
    el("tabs").style.display = "";
  } else {
    var activePanel = document.querySelector(".mobile-tab.active");
    if (activePanel) switchMobilePanel(activePanel.dataset.panel);
  }
});

async function init() {
  loadSession();
  var saved = localStorage.getItem("rightWidth");
  if (saved) el("right").style.width = saved + "px";
  var results = await Promise.all([fbLoad("cards"), fbLoad("memos"), fbLoad("memoCats")]);
  if (results[0] && results[0].length) {
    cards = results[0].slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  }
  if (results[1] && results[1].length) memos = results[1].slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  if (results[2] && results[2].length) { memoCats = results[2]; nextCatId = Math.max.apply(null, results[2].map(function(x){ return x.id||0; }))+1; }
  renderGrid(); renderMemoFilter(); renderMemos(); renderCatTrigger();
  if (isMobile()) switchMobilePanel("collection");
  setupRealtimeListeners();
  el("loading").style.display = "none";
  el("app").style.display = "block";
  renderProfileArea();
  updateUIForAuth();
  if (!isLoggedIn()) openOverlay("login-overlay");
}
init();
</script>
</body>
</html>
